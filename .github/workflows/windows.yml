name: Crear instalador Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crear app e instalador y probar instalación
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Bajada-Windows
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 30
