name: Crear y validar instalador Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crear app e instalador y probar instalación
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Bajada-Windows
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-validation
          path: |
            build-tools/validation-packaged/*
            build-tools/validation-installed/*
  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Bajada-Windows
          path: candidate
      - name: Instalación, actualización, conversión y recuperación
        shell: pwsh
        run: ./test-installed-windows.ps1 -Installer "$PWD/candidate/Bajada-Setup.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-${{ matrix.os }}
          path: validation-results/**
